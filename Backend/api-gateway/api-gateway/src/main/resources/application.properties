spring.application.name=api-gateway



spring.config.import=configserver:http://localhost:8888

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
# Gateway Route
spring.cloud.gateway.server.webflux.routes[0].id=catalog-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://CATALOG-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/catalog/**

spring.cloud.gateway.server.webflux.routes[1].id=auth-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/auth/**

# Actuator
management.endpoint.gateway.access=read-only
management.endpoints.web.exposure.include=health,info,gateway

